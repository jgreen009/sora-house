<div class="lightbox" inert aria-hidden="true" role="dialog" aria-modal="true" aria-label="Gallery image">
  <button class="lightbox__close" type="button" aria-label="Close gallery">✕</button>
  <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous image">←</button>
  <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next image">→</button>
  <div class="lightbox__figure">
    <img alt="">
    <div class="lightbox__caption"><span></span><span></span></div>
  </div>
  <div class="lightbox__counter"></div>
</div>
