<section class="page-head">
  <div class="container">
    <div class="page-head__inner">
      <div class="page-head__title reveal">
        <span class="eyebrow">Gallery</span>
        <h1 class="display-l" style="margin-top:16px">The house in its own light</h1>
      </div>
      <div class="page-head__aside reveal" data-delay="1">
        <p class="body-s text-muted">Rooms, materials, and the Atlantic coast. Select any image for a closer look.</p>
      </div>
    </div>
  </div>
</section>

<section class="section section--tight" style="padding-top:0">
  <div class="container">
    <div class="filters reveal" role="group" aria-label="Filter gallery by category">
      <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
      <button class="filter" type="button" data-filter="architecture" aria-pressed="false">Architecture</button>
      <button class="filter" type="button" data-filter="rooms" aria-pressed="false">Rooms</button>
      <button class="filter" type="button" data-filter="coast" aria-pressed="false">Coastal life</button>
      <button class="filter" type="button" data-filter="dining" aria-pressed="false">Dining</button>
    </div>

    <div class="gallery-grid">
      <button class="gallery-item gallery-item--wide" data-category="coast" data-lightbox="gallery" data-caption="Coastal path, morning" data-meta="01 / 12">
        <span class="figure figure--16x10"><img src="../../assets/gallery/g03.svg" alt="A sandy path over the dunes towards a flat Atlantic horizon." width="1400" height="900" loading="lazy"></span>
        <span class="caption"><span>Coastal path, morning</span><span>01</span></span>
      </button>

      <button class="gallery-item gallery-item--tall" data-category="architecture" data-lightbox="gallery" data-caption="West arches, late afternoon" data-meta="02 / 12">
        <span class="figure figure--3x4"><img src="../../assets/gallery/g09.svg" alt="The arched facade of Sora House in late afternoon light." width="1200" height="1500" loading="lazy"></span>
        <span class="caption"><span>West arches</span><span>02</span></span>
      </button>

      <button class="gallery-item gallery-item--wide" data-category="dining" data-lightbox="gallery" data-caption="The long table, set" data-meta="03 / 12">
        <span class="figure figure--16x10"><img src="../../assets/gallery/g05.svg" alt="The long oak table laid for dinner." width="1400" height="900" loading="lazy"></span>
        <span class="caption"><span>The long table</span><span>03</span></span>
      </button>

      <button class="gallery-item gallery-item--std" data-category="architecture" data-lightbox="gallery" data-caption="Plaster, late light" data-meta="04 / 12">
        <span class="figure figure--4x3"><img src="../../assets/gallery/g02.svg" alt="Afternoon light falling across a lime-plaster wall." width="1400" height="900" loading="lazy"></span>
        <span class="caption"><span>Plaster, late light</span><span>04</span></span>
      </button>

      <button class="gallery-item gallery-item--std" data-category="rooms" data-lightbox="gallery" data-caption="Linen and oak" data-meta="05 / 12">
        <span class="figure figure--4x3"><img src="../../assets/gallery/g08.svg" alt="Folded linen on an oak bench." width="1400" height="900" loading="lazy"></span>
        <span class="caption"><span>Linen and oak</span><span>05</span></span>
      </button>

      <button class="gallery-item gallery-item--std" data-category="rooms" data-lightbox="gallery" data-caption="Dune Room" data-meta="06 / 12">
        <span class="figure figure--4x3"><img src="../../assets/gallery/g10.svg" alt="An arched window in a room looking west towards the sea." width="1400" height="900" loading="lazy"></span>
        <span class="caption"><span>Dune Room</span><span>06</span></span>
      </button>

      <button class="gallery-item gallery-item--std" data-category="dining" data-lightbox="gallery" data-caption="Oak and stone" data-meta="07 / 12">
        <span class="figure figure--4x3"><img src="../../assets/experiences/sora-table-detail.svg" alt="oak and stone at the table." width="1400" height="900" loading="lazy"></span>
        <span class="caption"><span>Oak and stone</span><span>07</span></span>
      </button>

      <button class="gallery-item gallery-item--std" data-category="coast" data-lightbox="gallery" data-caption="The arrival path" data-meta="08 / 12">
        <span class="figure figure--4x3"><img src="../../assets/gallery/g07.svg" alt="The pale gravel approach to the house, framed by dune grass." width="1400" height="900" loading="lazy"></span>
        <span class="caption"><span>The arrival path</span><span>08</span></span>
      </button>

      <button class="gallery-item gallery-item--wide" data-category="rooms" data-lightbox="gallery" data-caption="A room before anyone arrives" data-meta="09 / 12">
        <span class="figure figure--16x10"><img src="../../assets/gallery/g04.svg" alt="A guest room in daylight, bed made, chair by the window." width="1400" height="900" loading="lazy"></span>
        <span class="caption"><span>Before anyone arrives</span><span>09</span></span>
      </button>

      <button class="gallery-item gallery-item--std" data-category="architecture" data-lightbox="gallery" data-caption="Courtyard threshold" data-meta="10 / 12">
        <span class="figure figure--4x3"><img src="../../assets/gallery/g01.svg" alt="The limestone facade with a row of deep arches." width="1200" height="1500" loading="lazy"></span>
        <span class="caption"><span>Courtyard threshold</span><span>10</span></span>
      </button>

      <button class="gallery-item gallery-item--std" data-category="coast" data-lightbox="gallery" data-caption="Atlantic outlook" data-meta="11 / 12">
        <span class="figure figure--4x3"><img src="../../assets/gallery/g11.svg" alt="The Atlantic seen from the dunes." width="1400" height="900" loading="lazy"></span>
        <span class="caption"><span>Atlantic outlook</span><span>11</span></span>
      </button>

      <button class="gallery-item gallery-item--wide" data-category="dining" data-lightbox="gallery" data-caption="The quiet room" data-meta="12 / 12">
        <span class="figure figure--16x10"><img src="../../assets/gallery/g06.svg" alt="A quiet room with linen, low light and a bowl of warm water." width="1400" height="900" loading="lazy"></span>
        <span class="caption"><span>The quiet room</span><span>12</span></span>
      </button>
    </div>

    <p class="body-s text-muted" style="margin-top:32px" data-gallery-status role="status" aria-live="polite">12 images · Architecture, rooms, and the Atlantic coast.</p>
  </div>
</section>

<!-- ============================================================ CLOSE -->
<section class="section section--sand">
  <div class="container">
    <div class="split-note">
      <div class="split-note__label"><span class="eyebrow">Your stay</span></div>
      <div class="split-note__body">
        <h2 class="display-l" style="margin-bottom:24px">See it for yourself</h2>
        <p class="lede" style="margin-bottom:32px">Twelve rooms on the same coast as all of this.</p>
        <a class="btn" href="book.html">Check availability</a>
      </div>
    </div>
  </div>
</section>
